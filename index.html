<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Carousel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>

html, body {
    margin:0;
    padding:0;
    background:transparent;
    overflow-x:hidden;
    font-family:Arial, sans-serif;
}

.wrapper {
    width:100vw;
    position:relative;
    left:50%;
    transform:translateX(-50%);
}

.swiper {
    width:100%;
    padding:5px 0 15px;
}

.card {
    cursor:pointer;
    transition:.25s ease;
}

.card:hover {
    transform:scale(1.04);
    z-index:2;
}

.thumb {
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:8px;
}

.thumb img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.3s ease;
}

.card:hover img {
    transform:scale(1.05);
}

.play {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    
    width:58px;
    height:58px;
    
    border-radius:50%;
    background:rgba(0,0,0,.65);
    
    display:flex;
    align-items:center;
    justify-content:center;
    
    opacity:0;
    transition:.25s;
}

.card:hover .play {
    opacity:1;
}

.play svg {
    width:25px;
    fill:white;
    margin-left:3px;
}


.swiper-button-next,
.swiper-button-prev {
    color:white;
    background:rgba(0,0,0,.55);
    width:38px;
    height:38px;
    border-radius:50%;
}

.swiper-button-next:after,
.swiper-button-prev:after {
    font-size:14px;
}


/* Modal */

.modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:9999;
    align-items:center;
    justify-content:center;
}

.modal-content {
    width:min(1200px,90vw);
}

.video {
    aspect-ratio:16/9;
}

.video iframe {
    width:100%;
    height:100%;
    border:none;
    border-radius:10px;
}

.close {
    color:white;
    font-size:38px;
    text-align:right;
    cursor:pointer;
}

</style>

</head>


<body>


<div class="wrapper">

<div class="swiper">

<div class="swiper-wrapper" id="videos"></div>

<div class="swiper-button-prev"></div>
<div class="swiper-button-next"></div>

</div>

</div>



<div class="modal" id="modal">

<div class="modal-content">

<div class="close" onclick="closeVideo()">
&times;
</div>

<div class="video">

<iframe 
id="player"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


<script>

const videos=[

"9zLIPMK7x5k",
"UFh8sC6uN18",
"_z3kABCV1IA",
"xiNwLR7lE14",
"S9fgV3Pd504",
"uCzvRHNZoQw",
"8tteYIf8mac",
"INgpcU4FheE"

];


const container=document.getElementById("videos");


videos.forEach(id=>{

container.innerHTML += `

<div class="swiper-slide">

<div class="card" onclick="play('${id}')">

<div class="thumb">

<img src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg">

<div class="play">

<svg viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>

</div>

</div>

</div>

</div>

`;

});



new Swiper(".swiper", {

loop:true,

slidesPerView:3.35,

spaceBetween:8,

navigation:{
nextEl:".swiper-button-next",
prevEl:".swiper-button-prev"
},

breakpoints:{

0:{
slidesPerView:1.15
},

768:{
slidesPerView:2.25
},

1200:{
slidesPerView:3.35
}

}

});



function play(id){

document.getElementById("modal").style.display="flex";

document.getElementById("player").src =
`https://www.youtube.com/embed/${id}?autoplay=1`;

}


function closeVideo(){

document.getElementById("modal").style.display="none";

document.getElementById("player").src="";

}


document.getElementById("modal").onclick=function(e){

if(e.target.id==="modal"){
closeVideo();
}

};


document.addEventListener("keydown",function(e){

if(e.key==="Escape"){
closeVideo();
}

});

</script>


</body>
</html>
