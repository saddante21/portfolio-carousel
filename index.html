<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Carousel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>

html, body {
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


.wrapper {
    width:100%;
}


.swiper {
    width:100%;
}


.swiper-wrapper {
    align-items:flex-start;
}


/* Responsive slide sizing */

.swiper-slide {

    width: calc((100% - 20px) / 3.15);

}


@media(max-width:900px){

    .swiper-slide {

        width: calc((100% - 10px) / 2.15);

    }

}


@media(max-width:600px){

    .swiper-slide {

        width: calc(100% / 1.15);

    }

}


/* Video card */

.card {
    cursor:pointer;
}


.thumb {

    width:100%;

    aspect-ratio:16 / 9;

    position:relative;

    overflow:hidden;

    border-radius:8px;

}


.thumb img {

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


/* Play button */

.play {

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);


    width:55px;

    height:55px;


    background:rgba(0,0,0,.65);

    border-radius:50%;


    display:flex;

    align-items:center;

    justify-content:center;


    opacity:0;

    transition:.2s;

}


.card:hover .play {

    opacity:1;

}


.play svg {

    width:24px;

    fill:white;

    margin-left:3px;

}



/* arrows */

.swiper-button-next,
.swiper-button-prev {

    color:white;

    background:rgba(0,0,0,.55);

    width:36px;

    height:36px;

    border-radius:50%;

}


.swiper-button-next:after,
.swiper-button-prev:after {

    font-size:13px;

}



/* Popup video */

.modal {

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.85);

    z-index:9999;

    align-items:center;

    justify-content:center;

}


.modal-content {

    width:90vw;

    max-width:1100px;

}


.video {

    aspect-ratio:16/9;

}


.video iframe {

    width:100%;

    height:100%;

    border:0;

}


.close {

    color:white;

    font-size:38px;

    text-align:right;

    cursor:pointer;

}


</style>

</head>


<body>


<div class="wrapper">

<div class="swiper">

<div class="swiper-wrapper" id="videos"></div>


<div class="swiper-button-prev"></div>

<div class="swiper-button-next"></div>


</div>

</div>



<div class="modal" id="modal">

<div class="modal-content">

<div class="close" onclick="closeVideo()">
&times;
</div>


<div class="video">

<iframe 
id="player"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


<script>


const videos=[

"9zLIPMK7x5k",
"UFh8sC6uN18",
"_z3kABCV1IA",
"xiNwLR7lE14",
"S9fgV3Pd504",
"uCzvRHNZoQw",
"8tteYIf8mac",
"INgpcU4FheE"

];


const container=document.getElementById("videos");


videos.forEach(id=>{


container.innerHTML += `

<div class="swiper-slide">

<div class="card" onclick="play('${id}')">


<div class="thumb">

<img src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg">


<div class="play">

<svg viewBox="0 0 24 24">

<path d="M8 5v14l11-7z"/>

</svg>

</div>


</div>


</div>

</div>

`;

});




new Swiper(".swiper", {


loop:true,


spaceBetween:10,


slidesPerView:"auto",


navigation:{

nextEl:".swiper-button-next",

prevEl:".swiper-button-prev"

}


});





function play(id){

document.getElementById("modal").style.display="flex";

document.getElementById("player").src =
`https://www.youtube.com/embed/${id}?autoplay=1`;

}



function closeVideo(){

document.getElementById("modal").style.display="none";

document.getElementById("player").src="";

}



document.getElementById("modal").onclick=function(e){

if(e.target.id==="modal"){

closeVideo();

}

};



document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

closeVideo();

}

});


</script>


</body>

</html>
