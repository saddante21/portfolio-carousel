<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Carousel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>

html, body {
    margin:0;
    padding:0;
    background:transparent;
    overflow-x:hidden;
    font-family:Arial, sans-serif;
}


.wrapper {
    width:100%;
}


.swiper {
    width:100%;
    padding:0;
}


.swiper-wrapper {
    align-items:flex-start;
}


.swiper-slide {

    width:31.5%;

}


@media(max-width:900px){

.swiper-slide {

    width:48%;

}

}


@media(max-width:600px){

.swiper-slide {

    width:90%;

}

}



.card {

    cursor:pointer;

}


.thumb {

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    border-radius:8px;

}


.thumb img {

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}



/* hover play button */

.play {

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    width:55px;

    height:55px;

    background:rgba(0,0,0,.65);

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    opacity:0;

    transition:.2s;

}


.card:hover .play {

    opacity:1;

}


.play svg {

    width:24px;

    fill:white;

}


/* arrows */

.swiper-button-next,
.swiper-button-prev {

    color:white;

    background:rgba(0,0,0,.55);

    width:36px;

    height:36px;

    border-radius:50%;

}


.swiper-button-next:after,
.swiper-button-prev:after {

    font-size:13px;

}

</style>

</head>


<body>


<div class="wrapper">

<div class="swiper">

<div class="swiper-wrapper" id="videos"></div>


<div class="swiper-button-prev"></div>

<div class="swiper-button-next"></div>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


<script>


const videos=[

"9zLIPMK7x5k",
"UFh8sC6uN18",
"_z3kABCV1IA",
"xiNwLR7lE14",
"S9fgV3Pd504",
"uCzvRHNZoQw",
"8tteYIf8mac",
"INgpcU4FheE"

];


const container=document.getElementById("videos");


videos.forEach(id=>{


container.innerHTML += `

<div class="swiper-slide">

<div class="card">

<div class="thumb">

<img src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg">


<div class="play">

<svg viewBox="0 0 24 24">

<path d="M8 5v14l11-7z"/>

</svg>

</div>


</div>

</div>

</div>

`;

});



new Swiper(".swiper", {

loop:true,

slidesPerView:"auto",

spaceBetween:10,

navigation:{

nextEl:".swiper-button-next",

prevEl:".swiper-button-prev"

}

});


</script>


</body>

</html>
