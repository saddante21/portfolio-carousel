<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Carousel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    background:transparent;
    overflow:hidden;
}


.swiper {
    width:100%;
    height:auto;
}


.swiper-wrapper {
    align-items:center;
}


.swiper-slide {
    width:31.5%;
}


@media(max-width:900px){

    .swiper-slide {
        width:48%;
    }

}


@media(max-width:600px){

    .swiper-slide {
        width:90%;
    }

}



.thumb {

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    border-radius:8px;

}


.thumb img {

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}



.card {

    cursor:pointer;

}



.swiper-button-next,
.swiper-button-prev {

    color:white;

    width:35px;

    height:35px;

    background:rgba(0,0,0,.55);

    border-radius:50%;

}


.swiper-button-next:after,
.swiper-button-prev:after {

    font-size:12px;

}



</style>

</head>


<body>


<div class="swiper">

<div class="swiper-wrapper" id="videos"></div>


<div class="swiper-button-prev"></div>

<div class="swiper-button-next"></div>


</div>



<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


<script>


const videos=[

"9zLIPMK7x5k",
"UFh8sC6uN18",
"_z3kABCV1IA",
"xiNwLR7lE14",
"S9fgV3Pd504",
"uCzvRHNZoQw",
"8tteYIf8mac",
"INgpcU4FheE"

];


const container=document.getElementById("videos");


videos.forEach(id=>{


container.innerHTML += `

<div class="swiper-slide">

<div class="card">

<div class="thumb">

<img src="https://i.ytimg.com/vi/${id}/maxresdefault.jpg">

</div>

</div>

</div>

`;

});



new Swiper(".swiper", {

loop:true,

spaceBetween:10,

slidesPerView:"auto",

navigation:{

nextEl:".swiper-button-next",

prevEl:".swiper-button-prev"

}

});


</script>


</body>

</html>
