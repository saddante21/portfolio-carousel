<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Carousel</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
/>

<style>

body{
    margin:0;
    background:#111;
    font-family:Inter,Arial,sans-serif;
    color:white;
}

.wrapper{
    width:95%;
    max-width:1700px;
    margin:40px auto;
}

.swiper{
    padding:10px 8px 40px;
}

.card{

    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-6px) scale(1.03);
}

.thumb{
    position:relative;
    overflow:hidden;
    border-radius:14px;
    aspect-ratio:16/9;
}

.thumb img{
    width:100%;
    display:block;
}

.play{

    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:74px;
    height:74px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:.25s;
}

.card:hover .play{
    opacity:1;
}

.play svg{
    width:30px;
    fill:white;
    margin-left:4px;
}

.title{
    margin-top:12px;
    font-size:17px;
    line-height:1.35;
    font-weight:600;
}

.swiper-button-next,
.swiper-button-prev{
    color:white;
}

.swiper-pagination-bullet-active{
    background:white;
}

/* Modal */

.modal{

    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:9999;

    justify-content:center;
    align-items:center;
}

.modal-content{

    width:min(1200px,90vw);
}

.video{

    aspect-ratio:16/9;
}

.video iframe{
    width:100%;
    height:100%;
    border:none;
    border-radius:12px;
}

.close{

    color:white;
    font-size:42px;
    cursor:pointer;
    text-align:right;
    margin-bottom:12px;
}

.youtube{

    display:inline-block;
    margin-top:18px;
    color:white;
    text-decoration:none;
    background:#ff0000;
    padding:12px 22px;
    border-radius:8px;
    font-weight:600;
}

</style>

</head>

<body>

<div class="wrapper">

<div class="swiper">

<div class="swiper-wrapper" id="videos"></div>

<div class="swiper-button-prev"></div>
<div class="swiper-button-next"></div>

<div class="swiper-pagination"></div>

</div>

</div>

<div class="modal" id="modal">

<div class="modal-content">

<div class="close" onclick="closeVideo()">&times;</div>

<div class="video">
<iframe
id="player"
allowfullscreen
allow="autoplay">
</iframe>
</div>

<a
id="ytLink"
class="youtube"
target="_blank">
Watch on YouTube
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

const videos=[

{
title:"The Story Behind Reggie Miller",
id:"9zLIPMK7x5k"
},

{
title:"The Curious Case of Kawhi Leonard",
id:"UFh8sC6uN18"
},

{
title:"The Story Behind Cooper Flagg",
id:"_z3kABCV1IA"
},

{
title:"Luka or SGA? Redrafting the LOADED 2018 NBA Draft!",
id:"xiNwLR7lE14"
},

{
title:"92 For No. 99 | The Most ABSURD Goal-Scoring Season In NHL History",
id:"uCzvRHNZoQw"
},

{
title:"Trae GONE: Why Young Might've Played His LAST Game In Atlanta",
id:"INgpcU4FheE"
}

];

const container=document.getElementById("videos");

videos.forEach(video=>{

container.innerHTML+=`

<div class="swiper-slide">

<div class="card" onclick="play('${video.id}')">

<div class="thumb">

<img src="https://i.ytimg.com/vi/${video.id}/maxresdefault.jpg">

<div class="play">

<svg viewBox="0 0 24 24">

<path d="M8 5v14l11-7z"/>

</svg>

</div>

</div>

<div class="title">${video.title}</div>

</div>

</div>

`;

});

new Swiper('.swiper',{

loop:true,

spaceBetween:24,

slidesPerView:1,

pagination:{
el:'.swiper-pagination',
clickable:true
},

navigation:{
nextEl:'.swiper-button-next',
prevEl:'.swiper-button-prev'
},

breakpoints:{

640:{
slidesPerView:2
},

1000:{
slidesPerView:3
},

1400:{
slidesPerView:4
}

}

});

function play(id){

document.getElementById("modal").style.display="flex";

document.getElementById("player").src=
`https://www.youtube.com/embed/${id}?autoplay=1`;

document.getElementById("ytLink").href=
`https://youtu.be/${id}`;

}

function closeVideo(){

document.getElementById("modal").style.display="none";

document.getElementById("player").src="";

}

document.getElementById("modal").addEventListener("click",e=>{

if(e.target.id==="modal"){

closeVideo();

}

});

document.addEventListener("keydown",e=>{

if(e.key==="Escape"){

closeVideo();

}

});

</script>

</body>
</html>
